[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-mlops-platform"
version = "0.1.0"
description = "Local-first scaffold for a GCP Vertex AI predictive maintenance MLOps platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Maintainers" }]
dependencies = ["PyYAML>=6.0,<7.0", "pandas>=2.2,<3.0", "numpy>=1.26,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.4,<1.0"]
dashboard = ["streamlit>=1.35,<2.0"]

[project.scripts]
vertex-mlops-platform = "vertex_mlops_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
